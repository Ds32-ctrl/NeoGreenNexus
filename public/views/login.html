<!-- public/views/login.html -->
<div class="login-modal-box hide-scroll">
  <button type="button" id="closeModal" aria-label="Cerrar ventana" style="
    position: absolute; top: 12px; right: 18px;
    background: transparent; border: none; font-size: 1.5rem;
    color: var(--text-muted); cursor: pointer; transition: color 0.3s;">&times;</button>

  <div style="color: var(--primary-neon); margin-bottom: 0.8rem;">
    <svg width="35" height="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 15 L85 35 L85 65 L50 85 L15 65 L15 35 Z" stroke="currentColor" stroke-width="3" fill="none"/>
      <circle cx="50" cy="50" r="8" fill="currentColor"/>
    </svg>
  </div>
  
  <h2 id="authTitle" style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.3rem; color: var(--text-main);">Iniciar Sesión</h2>
  <p id="authSubtitle" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Accede a tu entorno personal.</p>

  <input type="email" id="loginEmail" class="form-input" placeholder="Correo electrónico" style="margin-bottom: 10px; padding: 10px 14px;">
  <input type="password" id="loginPassword" class="form-input" placeholder="Contraseña" style="margin-bottom: 10px; padding: 10px 14px;">

  <!-- CAMPOS DE REGISTRO OCULTOS -->
  <div id="extraRegisterFields" style="display: none;">
    <input type="text" id="regName" class="form-input" placeholder="Nombre completo" style="margin-bottom: 10px; padding: 10px 14px;">
      
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <select id="regDay" style="flex: 1; padding: 10px 5px; border-radius: 12px; background: var(--bg-color); border: 1px solid var(--border-card); color: var(--text-main); outline: none; font-size: 0.9rem; cursor: pointer;">
        <option value="" disabled selected>Día</option>
      </select>
      <select id="regMonth" style="flex: 1; padding: 10px 5px; border-radius: 12px; background: var(--bg-color); border: 1px solid var(--border-card); color: var(--text-main); outline: none; font-size: 0.9rem; cursor: pointer;">
        <option value="" disabled selected>Mes</option>
      </select>
      <select id="regYear" style="flex: 1.2; padding: 10px 5px; border-radius: 12px; background: var(--bg-color); border: 1px solid var(--border-card); color: var(--text-main); outline: none; font-size: 0.9rem; cursor: pointer;">
        <option value="" disabled selected>Año</option>
      </select>
    </div>
      
    <div style="margin-bottom: 15px; text-align: left;">
      <span style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; display: block; text-align: center;">Selecciona tu nodo visual:</span>
      <div id="avatarGrid" class="avatar-scroll" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-behavior: smooth;">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N1&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N1&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid var(--primary-neon); transition: 0.3s; background: var(--bg-color);">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N2&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N2&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: var(--bg-color);">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N3&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N3&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: var(--bg-color);">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N4&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N4&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: var(--bg-color);">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N5&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N5&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: var(--bg-color);">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N6&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N6&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: var(--bg-color);">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N7&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N7&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: var(--bg-color);">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N8&backgroundColor=e2e8f0" class="avatar-option" data-url="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=N8&backgroundColor=e2e8f0" style="min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: var(--bg-color);">
      </div>
    </div>
  </div>

  <button type="button" id="btnSubmitAuth" class="btn-save" style="width: 100%; justify-content: center; margin-top: 0; margin-bottom: 12px; padding: 12px;">
    Ingresar
  </button>

  <div style="display: flex; align-items: center; margin: 12px 0; color: var(--text-muted); font-size: 0.85rem;">
    <div style="flex: 1; height: 1px; background: var(--border-card);"></div>
    <span style="padding: 0 10px;">o</span>
    <div style="flex: 1; height: 1px; background: var(--border-card);"></div>
  </div>

  <button type="button" id="btnGoogleAuth" style="
    width: 100%; background: var(--bg-color); color: var(--text-main);
    border: 1px solid var(--border-card); padding: 10px; border-radius: 12px;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.3s;">
    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continuar con Google
  </button>

  <div style="margin-top: 15px; font-size: 0.85rem;">
    <span style="color: var(--text-muted);" id="toggleText">¿Aún no eres parte?</span>
    <a href="#" id="toggleAuthMode" style="color: var(--primary-neon); text-decoration: none; font-weight: 600; margin-left: 5px;">Crear cuenta</a>
  </div>

  <p id="authMessage" style="font-size: 0.85rem; margin-top: 10px; display: none;"></p>
</div>
